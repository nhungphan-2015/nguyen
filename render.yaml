services:
  - type: web
    name: showroom-queue
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 10000
      # FPT.AI key for the Southern female call voice (lannhi); unset = Google voice
      - key: FPT_TTS_KEY
        sync: false
